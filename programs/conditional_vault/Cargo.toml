[package]
name = "conditional_vault"
version = "0.4.0"
description = "SVM-based program for minting conditional tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conditional_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
production = []

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = { version = "0.28.0", features = ["token_2022"] }
spl-token-2022 = { version = "0.9", features = ["no-entrypoint"] }
solana-security-txt = "1.1.1"
